<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Happy Birthday</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0e17;
            font-family: 'Arial', 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #fffffe;
            border-radius: 40px;
            padding: 35px 25px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* === IMAGE SPOT === */
        .photo {
            width: 100%;
            height: 220px;
            background: #eaddcf;
            border-radius: 24px;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            color: #0f0e17;
            font-size: 0.9rem;
            opacity: 0.5;
        }

        /* === TEXT === */
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            color: #0f0e17;
            letter-spacing: -1px;
            margin-bottom: 4px;
        }

        .sub {
            font-size: 1rem;
            color: #ff8906;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .message {
            font-size: 1rem;
            line-height: 1.7;
            color: #2d2a3b;
            background: #f9f4f0;
            padding: 18px 16px;
            border-radius: 20px;
            margin-bottom: 22px;
        }

        /* === ICON ROW === */
        .icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .icons span {
            font-size: 1.8rem;
        }

        /* === BUTTON === */
        .btn {
            display: inline-block;
            background: #ff8906;
            color: #fffffe;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 14px 40px;
            border-radius: 60px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255, 137, 6, 0.35);
        }

        .btn:hover {
            background: #e67a00;
            transform: scale(1.03);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* === SECOND IMAGE (small) === */
        .photo-small {
            width: 100%;
            height: 100px;
            background: #eaddcf;
            border-radius: 18px;
            margin-top: 22px;
            overflow: hidden;
        }

        .photo-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* === FOOTER === */
        .footer {
            margin-top: 18px;
            font-size: 0.75rem;
            color: #a7a9be;
            letter-spacing: 1px;
        }

        .footer i {
            color: #ff8906;
        }

        /* responsive */
        @media (max-width: 450px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 2.5rem; }
            .photo { height: 170px; }
            .photo-small { height: 80px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- === MAIN IMAGE === -->
    <div class="photo">
        <!-- Replace src with your image URL -->
        <img 
            src="https://images.unsplash.com/photo-1558637845-e94c4a1ea0f5?w=600&h=400&fit=crop&crop=center" 
            alt="Birthday"
        />
    </div>

    <!-- TITLE -->
    <h1>Happy Birthday!</h1>
    <div class="sub">— celebrate —</div>

    <!-- MESSAGE -->
    <div class="message">
        Wishing you a day filled with love, laughter, and everything you deserve. 🎈
    </div>

    <!-- ICONS -->
    <div class="icons">
        <span>🎂</span>
        <span>🎁</span>
        <span>🎈</span>
        <span>🥳</span>
        <span>✨</span>
    </div>

    <!-- BUTTON -->
    <button class="btn" id="celebrateBtn">🎉 Celebrate</button>

    <!-- === SMALL SECOND IMAGE === -->
    <div class="photo-small">
        <!-- Replace src with your image URL -->
        <img 
            src="https://images.unsplash.com/photo-1558637845-e94c4a1ea0f5?w=600&h=200&fit=crop&crop=center" 
            alt="Celebration"
        />
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <span>❤️ made with love · 2026</span>
    </div>
</div>

<script>
    document.getElementById('celebrateBtn').addEventListener('click', function() {
        alert('🎂 Happy Birthday! Wishing you the best! 🎉');
        
        // mini confetti
        const emojis = ['🎉','🎊','✨','🎈','🥳','🎁'];
        for (let i = 0; i < 30; i++) {
            const el = document.createElement('span');
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            el.style.position = 'fixed';
            el.style.fontSize = (Math.random() * 2 + 1.2) + 'rem';
            el.style.left = Math.random() * 100 + 'vw';
            el.style.top = '-20px';
            el.style.pointerEvents = 'none';
            el.style.zIndex = '9999';
            el.style.transition = 'all 3.5s ease-out';
            document.body.appendChild(el);
            
            requestAnimationFrame(() => {
                el.style.transform = `translateY(${80 + Math.random() * 50}vh) rotate(${Math.random() * 360}deg)`;
                el.style.opacity = '0';
            });
            
            setTimeout(() => el.remove(), 4000);
        }
    });
</script>

</body>
</html>
